<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Applies the theme the visitor picked, before the page is drawn, so it
       doesn't flash. It's inline and not deferred for that reason. See theme.js. -->
  <script>
    try {
      const saved = localStorage.getItem("color-scheme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.classList.add(saved);
        document.querySelector('meta[name="color-scheme"]').content = saved;
      }
    } catch (e) {}
  </script>
  <title>Page not found - cookieZ</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <!-- The heading uses this font, so fetch it straight away. -->
  <link rel="preload" href="/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css?v=1.5.0">
  <script src="/theme.js?v=1.5.0" defer></script>
</head>
<body>

            </g>
          </svg>
